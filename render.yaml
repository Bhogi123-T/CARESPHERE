services:
  - type: web
    name: caresphere-backend
    env: python
    plan: free
    rootDir: ehs-backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: caresphere-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true

databases:
  - name: caresphere-db
    plan: free
    databaseName: ehs
    user: ehs_admin
