<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Ecosystem Health Response</title>
    <!-- Google Translate Script -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <style>
      /* Hide the top Google Translate banner */
      .skiptranslate > iframe {
        display: none !important;
      }
      body {
        top: 0 !important;
      }
      
      #google_translate_element {
        display: none !important;
      }
      
      /* Make the dropdown container look better */
      .goog-te-combo {
        background-color: #1e293b;
        color: #f8fafc;
        border: 1px solid #334155;
        border-radius: 6px;
        padding: 6px;
        font-family: inherit;
        outline: none;
        cursor: pointer;
        width: 150px;
      }
      
      .goog-te-combo:hover {
        border-color: #38bdf8;
      }
      
      .goog-logo-link, .goog-te-gadget span, .goog-te-gadget a {
        display: none !important;
      }
      
      .goog-te-gadget {
        color: transparent !important;
        font-size: 0px !important;
      }
    </style>
  </head>
  <body>
    <!-- Hidden div for Google Translate to attach to -->
    <div id="google_translate_element"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
